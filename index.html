<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>程式語言設計 - 抽卡特訓班 (30題連擊版)</title>
    <style>
        body {
            font-family: '微軟正黑體', sans-serif; 
            background-color: #1a1a2e; 
            color: #ecf0f1; display: flex; justify-content: center;
            align-items: center; height: 100vh; margin: 0; overflow: hidden;
            transition: background-color 0.5s ease; 
        }
        
        body.rescue-mode { background-color: #4a1010; }

        .container {
            background-color: #2c3e50; width: 90%; max-width: 650px;
            padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center; max-height: 90vh; overflow-y: auto; position: relative;
        }
        h1 { color: #f1c40f; margin-bottom: 5px; }
        .subtitle { color: #95a5a6; margin-bottom: 20px; font-size: 14px; }
        
        #student-setup { display: block; }
        #game-area { display: none; }
        #result-area { display: none; }

        input[type="text"] {
            width: 80%; padding: 15px; font-size: 18px; border-radius: 8px; 
            border: 2px solid #3498db; background: #1a1a2e; color: white; 
            text-align: center; margin-bottom: 20px;
        }
        
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: #16213e; padding: 10px 20px; border-radius: 10px; margin-bottom: 20px;
        }
        .hp-bar { font-size: 18px; color: #e74c3c; text-align: left; display: flex; align-items: center; gap: 10px;}
        .streak-badge { background: #d35400; color: white; padding: 3px 8px; border-radius: 5px; font-size: 14px; font-weight: bold; }
        
        .inventory { font-size: 14px; color: #f1c40f; text-align: right; font-weight: bold;}
        
        .tag {
            display: inline-block; background: #e74c3c; color: white;
            padding: 5px 10px; border-radius: 5px; font-size: 14px; margin-bottom: 15px; font-weight: bold;
        }
        .question-text { font-size: 22px; line-height: 1.5; margin-bottom: 30px; }

        .btn {
            display: block; width: 100%; padding: 15px; margin-bottom: 15px;
            font-size: 18px; cursor: pointer; border: none; border-radius: 8px;
            background-color: #34495e; color: white; font-weight: bold; transition: 0.2s; box-shadow: 0 4px #2c3e50;
        }
        .btn:hover { background-color: #3498db; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-start { background-color: #27ae60; box-shadow: 0 4px #1e8449; margin-top: 10px; }
        .btn-collection { background-color: #8e44ad; box-shadow: 0 4px #732d91; }

        #log-report { text-align: left; background: #1a1a2e; padding: 15px; border-radius: 8px; color: #f39c12; font-size: 16px; margin-bottom: 20px; max-height: 200px; overflow-y: auto;}
        
        #correct-splash {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 80px; font-weight: bold; color: #2ecc71; text-shadow: 0 0 30px rgba(46, 204, 113, 0.8);
            opacity: 0; pointer-events: none; transition: 0.3s; z-index: 150;
        }
        #correct-splash.show { opacity: 1; transform: translate(-50%, -60%) scale(1.2); }

        #gacha-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center;
            align-items: center; flex-direction: column; z-index: 200;
        }
        .gacha-card {
            width: 250px; height: 350px; border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 24px; font-weight: bold; color: white; text-align: center; padding: 20px; box-sizing: border-box; transform: scale(0);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-shadow: 2px 2px 4px rgba(0,0,0,0.5); position: relative; overflow: hidden;
        }
        .card-SP { background: linear-gradient(135deg, #ff00cc, #3333ff); box-shadow: 0 0 50px #ff00cc; border: 3px solid #fff; }
        .card-UR { background: linear-gradient(135deg, #FFD700, #FF8C00); box-shadow: 0 0 40px #FFD700; border: 3px solid #fff; }
        .card-SSR { background: linear-gradient(135deg, #ff007f, #7f00ff); box-shadow: 0 0 30px #ff007f; border: 2px solid #fff; }
        .card-SR { background: linear-gradient(135deg, #00d2ff, #3a7bd5); box-shadow: 0 0 15px #00d2ff; }
        .card-R { background: linear-gradient(135deg, #7f8c8d, #2c3e50); }
        .card-N { background: linear-gradient(135deg, #bdc3c7, #7f8c8d); color: #2c3e50; border: 1px solid #95a5a6; }
        
        .gacha-title { color: white; font-size: 24px; margin-bottom: 20px; letter-spacing: 2px;}
        .gacha-btn { margin-top: 30px; padding: 15px 40px; font-size: 20px; font-weight: bold; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px #c0392b; transition: 0.2s;}
        .gacha-btn:active { transform: translateY(4px); box-shadow: none; }
        .gacha-btn-collect { background: #3498db; box-shadow: 0 4px #2980b9; }

        #collection-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95);
            display: none; justify-content: flex-start; align-items: center; flex-direction: column; z-index: 300; padding-top: 50px; overflow-y: auto;
        }
        .collection-header { color: #f1c40f; font-size: 28px; margin-bottom: 20px; text-shadow: 0 0 10px #f39c12; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; width: 90%; max-width: 800px; padding-bottom: 80px;}
        .mini-card { background: #2c3e50; border-radius: 10px; padding: 10px; text-align: center; border: 2px solid #34495e; position: relative; }
        .mini-card img { width: 100%; border-radius: 5px; margin-bottom: 10px; }
        .mini-card .name { font-size: 14px; font-weight: bold; color: white; }
        .mini-card .count { position: absolute; top: -10px; right: -10px; background: #e74c3c; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; border: 2px solid #fff; z-index: 10; }
        
        .mini-card.unowned { border-color: #555; background: #1a252f; }
        .mini-card.unowned img { filter: grayscale(100%) brightness(0.4); opacity: 0.6; }
        .mini-card.unowned .name { color: #7f8c8d; }
        
        .btn-synth { margin-top: 8px; padding: 6px 0; font-size: 13px; background: #e67e22; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; animation: pulse 1.5s infinite; }
        .btn-synth:hover { background: #d35400; }
        /* SR 合成專屬特效按鈕 */
        .btn-synth-sr { background: #9b59b6; box-shadow: 0 0 10px #9b59b6; animation: pulse-sr 1.2s infinite; }
        .btn-synth-sr:hover { background: #8e44ad; }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(230, 126, 34, 0); } 100% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0); } }
        @keyframes pulse-sr { 0% { box-shadow: 0 0 0 0 rgba(155, 89, 182, 0.8); } 70% { box-shadow: 0 0 0 10px rgba(155, 89, 182, 0); } 100% { box-shadow: 0 0 0 0 rgba(155, 89, 182, 0); } }
        
        .close-btn { margin-top: 30px; padding: 10px 30px; font-size: 18px; background: #95a5a6; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 50px;}
    </style>
</head>
<body>

    <div id="correct-splash">⭕ 正確！</div>

    <div id="gacha-overlay">
        <div class="gacha-title" id="gacha-title">✨ 連擊達成！獲得抽卡機會！ ✨</div>
        <button class="gacha-btn" id="pre-draw-btn" onclick="executeDraw()">👉 點擊抽卡 👈</button>
        <div class="gacha-card" id="revealed-card" style="display:none;">
            <img id="card-image" src="" style="width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; display: none;">
            <div id="card-name" style="font-size: 20px; line-height: 1.2;">卡片名稱</div>
        </div>
        <button class="gacha-btn gacha-btn-collect" id="post-draw-btn" onclick="closeGacha()" style="display:none;">收下神卡並繼續</button>
    </div>

    <div id="collection-modal">
        <div class="collection-header" id="collection-title">🏆 專屬集卡冊</div>
        <div class="card-grid" id="collection-grid"></div>
        <button class="close-btn" onclick="closeCollection()">返回首頁</button>
    </div>

    <div class="container">
        <div id="student-setup">
            <h1>🏀 統測特訓：30題不間斷！</h1>
            <div class="subtitle">連續答對 2 題即可抽卡！<br>(蒐集 5 張同款 N卡/SR卡 可覺醒隱藏神卡)</div>
            <input type="text" id="student-name" placeholder="請輸入 班級+座號+姓名">
            
            <button class="btn" id="btn-sync" style="background-color: #2980b9; box-shadow: 0 4px #1c5980;" onclick="syncCloudData()">☁️ 1. 載入雲端圖鑑存檔</button>
            
            <button class="btn btn-start" onclick="startGame()">▶️ 2. 開始 30 題大挑戰</button>
            <button class="btn btn-collection" onclick="openCollection()">📖 查看我的圖鑑進度</button>
        </div>

        <div id="game-area">
            <div class="status-bar">
                <div class="hp-bar" id="hp-display">
                    <span id="hearts">❤️❤️❤️</span>
                    <span class="streak-badge" id="streak-display">🔥 連擊: 0 / 2</span>
                </div>
                <div class="inventory" id="inventory-display">🎒 本局卡簿: 空</div>
            </div>
            <div class="tag" id="q-tag">標籤</div>
            <div class="question-text" id="q-text">題目載入中...</div>
            <div id="options-area"></div>
        </div>

        <div id="result-area">
            <h1>測驗完成！🎉</h1>
            <p>戰利品已自動存入集卡冊，診斷報告已傳送給老師。</p>
            <div id="log-report"></div>
            <button class="btn btn-collection" style="margin-top:20px;" onclick="location.reload()">返回首頁查看集卡冊</button>
        </div>
    </div>

    <script>
        // === 音效引擎 ===
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { 
            if (!audioCtx) audioCtx = new AudioContext(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
        }
        function playSound(type) {
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
                gain.gain.setValueAtTime(0.3, now); osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'draw') {
                osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(800, now + 0.5);
                gain.gain.setValueAtTime(0.2, now); osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'synth') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); 
                osc.frequency.linearRampToValueAtTime(600, now + 0.3);
                osc.frequency.linearRampToValueAtTime(1200, now + 0.6);
                gain.gain.setValueAtTime(0.4, now); osc.start(now); osc.stop(now + 0.7);
            }
        }

       // ==========================================
        // 教師設定區：教育心理學 (15題學術專業版 - 知識拆解導向)
        // ==========================================
        const quizData = {
            // --- 第 1 關：維高斯基 ZPD ---
            "q1": {
                tag: "第 1 關：認知發展理論",
                text: "維高斯基 (L. Vygotsky) 提出，學生「自己獨立解決問題的實際能力水準」與「在成人或能力較佳同儕引導下解決問題的潛在能力水準」之間的差距，稱為什麼？",
                options: [
                    { text: "A. 近側發展區 (ZPD)", next: "q2", isCorrect: true },
                    { text: "B. 鷹架作用 (Scaffolding)", next: "q1_help", log: "Q1錯: 混淆了發展區域與教學策略的定義" },
                    { text: "C. 認知失調 (Cognitive Dissonance)", next: "q1_help", log: "Q1錯: 這是態度與行為不一致的心理狀態" },
                    { text: "D. 認知負荷 (Cognitive Load)", next: "q1_help", log: "Q1錯: 這是指工作記憶的容量限制" }
                ]
            },
            "q1_help": {
                tag: "💊 救援任務：拆解概念層次",
                text: "知識拆解：題目詢問的是一個「空間/差距(Zone)」，而不是指老師給予的「協助/策略(Scaffold)」。這個介於已知與未知之間的「相近發展區域」簡稱是什麼？",
                options: [
                    { text: "A. 近側發展區 (ZPD)", next: "q1", isCorrect: true },
                    { text: "B. 鷹架作用", next: "q1_help", log: "Q1救錯: 鷹架是搭在這個區域內的梯子，不是區域本身喔！" }
                ]

            // --- 第 2 關：皮亞傑 守恆 ---
            "q2": {
                tag: "第 2 關：認知發展理論",
                text: "根據皮亞傑 (J. Piaget) 的認知發展論，兒童開始能夠理解「將相同水量的水從矮胖杯子倒入瘦長杯子，水量仍然一樣多」。這代表兒童具備了什麼概念？",

                    { text: "B. 物體恆存 (Object Permanence)", next: "q2_help", log: "Q2錯: 這是嬰兒期(感覺動作期)看不見物品仍知道其存在的概念" },

                ]
            },
            "q2_help": {

                text: "知識拆解：兒童不再被「杯子變高」的外表視覺特徵欺騙，能夠在心中進行「可逆性思考」，理解物質的本質量「守住不變」。這稱為什麼？",

            // --- 第 3 關：操作制約 負增強 ---
            "q3": {
                tag: "第 3 關：行為主義學習論",
                text: "老師為了鼓勵學生上課專心，宣布：「只要今天全班安靜聽講不吵鬧，今天的回家作業就『不用寫』。」請問老師運用了哪一種行為改變技術？",
                options: [
                    { text: "A. 負增強 (Negative Reinforcement)", next: "q4", isCorrect: true },
                    { text: "B. 正增強 (Positive Reinforcement)", next: "q3_help", log: "Q3錯: 正增強是『給予』喜歡的東西，但此處是『移除』" },
                    { text: "C. 懲罰 (Punishment)", next: "q3_help", log: "Q3錯: 懲罰的目的是『減少』行為，老師的目的是『增加』專心行為" },
                    { text: "D. 削弱 (Extinction)", next: "q3_help", log: "Q3錯: 削弱是不給予任何回應讓行為自然消失" }
                ]
            },
            "q3_help": {
                tag: "💊 救援任務：行為與刺激矩陣分析",
                text: "知識拆解：1. 老師的目的是「增加」專心行為 ➡️ 所以是「增強」。 2. 手段是「移除」學生討厭的刺激(寫作業) ➡️ 移除在數學上代表「負」。兩者結合是？",
                options: [
                    { text: "A. 負增強", next: "q3", isCorrect: true },
                    { text: "B. 正增強", next: "q3_help", log: "Q3救錯: 正增強是『發糖果』，免除作業是『拿走討厭的東西(負)』喔！" }
                ]
            },

            // --- 第 4 關：班杜拉 替代學習 ---
            "q4": {
                tag: "第 4 關：社會學習理論",
                text: "班杜拉 (A. Bandura) 認為個體不一定需要親自經歷獎懲，只要看到同學因為舉手發言而被老師稱讚，自己也會傾向多舉手。這種歷程稱為什麼？",
                options: [
                    { text: "A. 替代學習 (Vicarious Learning)", next: "q5", isCorrect: true },
                    { text: "B. 頓悟學習 (Insight Learning)", next: "q4_help", log: "Q4錯: 頓悟是完形心理學的主張，強調內部理解" },
                    { text: "C. 試誤學習 (Trial and Error)", next: "q4_help", log: "Q4錯: 這是桑代克的理論，強調盲目嘗試" },
                    { text: "D. 經典制約 (Classical Conditioning)", next: "q4_help", log: "Q4錯: 這是巴夫洛夫的反射行為理論" }
                ]
            },
            "q4_help": {
                tag: "💊 救援任務：觀察者的視角",
                text: "知識拆解：個體沒有「親自」受獎，而是透過觀察他人的經驗，在心中「代替」別人體驗了獎勵的結果，進而改變自己的行為。這叫什麼學習？",
                options: [
                    { text: "A. 替代學習 (觀察學習)", next: "q4", isCorrect: true },
                    { text: "B. 試誤學習", next: "q4_help", log: "Q4救錯: 學生沒有自己不斷嘗試錯誤，他是看別人學的！" }
                ]
            },

            // --- 第 5 關：馬斯洛 需求層次 ---
            "q5": {
                tag: "第 5 關：人本主義心理學",
                text: "根據馬斯洛 (A. Maslow) 的需求層次理論，當學生連早餐都沒吃、處於極度飢餓狀態時，教師很難要求他專心聽講，因為他缺乏了哪一層次的基本需求？",
                options: [
                    { text: "A. 生理需求 (Physiological Needs)", next: "q6", isCorrect: true },
                    { text: "B. 安全需求 (Safety Needs)", next: "q5_help", log: "Q5錯: 安全需求是指免於恐懼與威脅" },
                    { text: "C. 愛與隸屬需求 (Love and Belonging)", next: "q5_help", log: "Q5錯: 這是社交層面的人際需求" },
                    { text: "D. 自尊需求 (Esteem Needs)", next: "q5_help", log: "Q5錯: 這是追求成就與他人認可的需求" }
                ]
            },
            "q5_help": {
                tag: "💊 救援任務：匱乏性需求底層",
                text: "知識拆解：理論強調「低層次需求滿足後，才會追求高層次需求」。飢餓、口渴、睡眠屬於維持生命運作的最底層需求。這是什麼需求？",
                options: [
                    { text: "A. 生理需求", next: "q5", isCorrect: true },
                    { text: "B. 安全需求", next: "q5_help", log: "Q5救錯: 吃飯喝水是生理層面，不是安全層面喔！" }
                ]
            },

            // --- 第 6 關：溫納 歸因理論 ---
            "q6": {
                tag: "第 6 關：學習動機理論",
                text: "根據溫納 (B. Weiner) 的歸因理論，若學生將考試考差歸因於「我這次運氣太差了，剛好考我都沒讀的」，這屬於哪一種歸因向度？",
                options: [
                    { text: "A. 外在、不穩定、不可控制", next: "q7", isCorrect: true },
                    { text: "B. 內在、穩定、不可控制", next: "q6_help", log: "Q6錯: 這是歸因於『能力』的向度" },
                    { text: "C. 內在、不穩定、可控制", next: "q6_help", log: "Q6錯: 這是歸因於『努力』的向度" },
                    { text: "D. 外在、穩定、不可控制", next: "q6_help", log: "Q6錯: 這是歸因於『工作難度』的向度" }
                ]
            },
            "q6_help": {
                tag: "💊 救援任務：向度矩陣分析",
                text: "知識拆解：分析「運氣」的三向度：1. 源自外界(外在)；2. 每次考試運氣都會變(不穩定)；3. 自己無法決定運氣好壞(不可控制)。",
                options: [
                    { text: "A. 外在、不穩定、不可控制", next: "q6", isCorrect: true },
                    { text: "B. 內在、不穩定、可控制", next: "q6_help", log: "Q6救錯: 運氣不是『內在可控』的，努力才是喔！" }
                ]
            },

            // --- 第 7 關：訊息處理 精緻化複誦 ---
            "q7": {
                tag: "第 7 關：訊息處理理論",
                text: "為了將短期記憶轉化為長期記憶，教師引導學生使用口訣，並將新知識與學生舊有的生活經驗相連結。這種有效的記憶策略稱為？",
                options: [
                    { text: "A. 精緻化複誦 (Elaborative Rehearsal)", next: "q8", isCorrect: true },
                    { text: "B. 維持性複誦 (Maintenance Rehearsal)", next: "q7_help", log: "Q7錯: 這是指單純的機械式死背" },
                    { text: "C. 感覺登錄 (Sensory Register)", next: "q7_help", log: "Q7錯: 這是刺激剛進入感官的瞬間狀態" },
                    { text: "D. 認知失調 (Cognitive Dissonance)", next: "q7_help", log: "Q7錯: 這是社會心理學概念，與記憶策略無關" }
                ]
            },
            "q7_help": {
                tag: "💊 救援任務：記憶深加工",
                text: "知識拆解：比起單純死背的「維持性複誦」，將新知識加入意義、聯想、舊經驗，使其在腦中形成複雜網絡的「深層加工」過程，稱為什麼？",
                options: [
                    { text: "A. 精緻化複誦", next: "q7", isCorrect: true },
                    { text: "B. 維持性複誦", next: "q7_help", log: "Q7救錯: 維持性複誦只是反覆唸出聲音，無法深刻連結舊經驗！" }
                ]
            },

            // --- 第 8 關：艾瑞克森 自我統合 ---
            "q8": {
                tag: "第 8 關：心理社會發展論",
                text: "根據艾瑞克森 (E. Erikson) 的理論，高職學生（青少年期）最核心的心理社會發展危機是什麼？",
                options: [
                    { text: "A. 自我統合對角色混淆 (Identity vs. Role Confusion)", next: "q9", isCorrect: true },
                    { text: "B. 勤奮進取對自卑 (Industry vs. Inferiority)", next: "q8_help", log: "Q8錯: 這是國小學童期(6-12歲)的發展任務" },
                    { text: "C. 親密對孤立 (Intimacy vs. Isolation)", next: "q8_help", log: "Q8錯: 這是成年早期(青年期)的發展任務" },
                    { text: "D. 信任對不信任 (Trust vs. Mistrust)", next: "q8_help", log: "Q8錯: 這是嬰兒期的發展任務" }
                ]
            },
            "q8_help": {
                tag: "💊 救援任務：尋找自我的年紀",
                text: "知識拆解：青少年時期面臨升學、同儕與未來的選擇，他們不斷在問「我是誰？未來要做什麼？」。如果無法找到自身定位，就會產生角色的混淆。這對應哪個階段？",
                options: [
                    { text: "A. 自我統合對角色混淆", next: "q8", isCorrect: true },
                    { text: "B. 勤奮對自卑", next: "q8_help", log: "Q8救錯: 國小生才在比誰成績好(勤奮)，高中生已經在找尋人生定位(統合)了！" }
                ]
            },

            // --- 第 9 關：桑代克 效果律 ---
            "q9": {
                tag: "第 9 關：行為主義先驅",
                text: "桑代克 (E. Thorndike) 透過「貓迷籠實驗」提出，如果某個行為之後伴隨著『令人滿意』的結果，該行為再次發生的機率就會增加。這被稱為什麼定律？",
                options: [
                    { text: "A. 效果律 (Law of Effect)", next: "q10", isCorrect: true },
                    { text: "B. 練習律 (Law of Exercise)", next: "q9_help", log: "Q9錯: 練習律是指反覆練習能加強聯結" },
                    { text: "C. 準備律 (Law of Readiness)", next: "q9_help", log: "Q9錯: 準備律是指身心處於準備狀態時學習才有效" },
                    { text: "D. 系統脫敏法 (Systematic Desensitization)", next: "q9_help", log: "Q9錯: 這是臨床心理學用來治療恐懼症的方法" }
                ]
            },
            "q9_help": {
                tag: "💊 救援任務：結果決定論",
                text: "知識拆解：行為的「後果(效果)」決定了這個動作會不會被刻在腦海裡。得到好處(滿意的效果)就會學起來。這是桑代克三大定律的哪一個？",
                options: [
                    { text: "A. 效果律", next: "q9", isCorrect: true },
                    { text: "B. 練習律", next: "q9_help", log: "Q9救錯: 題目強調的是『滿意的結果』，而非『反覆練習』喔！" }
                ]
            },

            // --- 第 10 關：程序性知識 ---
            "q10": {
                tag: "第 10 關：認知心理學",
                text: "在知識的分類中，學生理解「如何操作顯微鏡對焦」或「如何騎腳踏車」的技能，屬於下列哪一種知識？",
                options: [
                    { text: "A. 程序性知識 (Procedural Knowledge)", next: "q11", isCorrect: true },
                    { text: "B. 陳述性知識 (Declarative Knowledge)", next: "q10_help", log: "Q10錯: 這是指知道『是什麼』的事實(如歷史年代)" },
                    { text: "C. 條件性知識 (Conditional Knowledge)", next: "q10_help", log: "Q10錯: 這是指知道『何時』、『為何』使用的策略" },
                    { text: "D. 概念性知識 (Conceptual Knowledge)", next: "q10_help", log: "Q10錯: 這是指知識間交互關聯的結構" }
                ]
            },
            "q10_help": {
                tag: "💊 救援任務：Know-How的特徵",
                text: "知識拆解：知識可分為「知道是什麼(know-what)」與「知道怎麼做(know-how)」。需要按部就班、透過動作演練而難以單用言語說明的，屬於具有「標準程序」的什麼知識？",
                options: [
                    { text: "A. 程序性知識", next: "q10", isCorrect: true },
                    { text: "B. 陳述性知識", next: "q10_help", log: "Q10救錯: 陳述性知識是用背的，騎腳踏車無法只靠背書學會！" }
                ]
            },

            // --- 第 11 關：比馬龍效應 ---
            "q11": {
                tag: "第 11 關：教師期望效應",
                text: "心理學家羅森泰 (R. Rosenthal) 研究發現，當教師對某些學生抱持「高度期望」時，這些學生在無形中受到正面引導，其智力或學業表現真的會顯著提升。這稱為什麼效應？",
                options: [
                    { text: "A. 比馬龍效應 (Pygmalion Effect)", next: "q12", isCorrect: true },
                    { text: "B. 霍桑效應 (Hawthorne Effect)", next: "q11_help", log: "Q11錯: 這是指因為『意識到被觀察』而改變行為的現象" },
                    { text: "C. 月暈效應 (Halo Effect)", next: "q11_help", log: "Q11錯: 這是以偏概全的認知偏差(如長得好看就覺得他聰明)" },
                    { text: "D. 破窗效應 (Broken Windows Theory)", next: "q11_help", log: "Q11錯: 這是犯罪學理論，指環境混亂會引發更多犯罪" }
                ]
            },
            "q11_help": {
                tag: "💊 救援任務：自我應驗預言",
                text: "知識拆解：此效應又稱「自我應驗預言」。源自希臘神話中，雕刻家對自己雕刻的少女傾注極大期望與愛，最終讓雕像活了過來的故事。這是哪個效應？",
                options: [
                    { text: "A. 比馬龍效應", next: "q11", isCorrect: true },
                    { text: "B. 霍桑效應", next: "q11_help", log: "Q11救錯: 霍桑效應是勞工因為被科學家盯著看而提高產能，無關教師期望！" }
                ]
            },

            // --- 第 12 關：內部動機 ---
            "q12": {
                tag: "第 12 關：學習動機理論",
                text: "學生在下課後主動留在工場拆解並研究電路板，他不是為了考試加分，純粹是因為「解決技術問題的過程讓他感到極大的成就感」。這展現了哪一種動機？",
                options: [
                    { text: "A. 內在動機 (Intrinsic Motivation)", next: "q13", isCorrect: true },
                    { text: "B. 外在動機 (Extrinsic Motivation)", next: "q12_help", log: "Q12錯: 外在動機是為了獎品或分數" },
                    { text: "C. 附屬動機 (Affiliative Drive)", next: "q12_help", log: "Q12錯: 附屬動機是為了獲得長輩或老師的讚許" },
                    { text: "D. 表現目標 (Performance Goal)", next: "q12_help", log: "Q12錯: 表現目標是為了向別人證明自己很厲害" }
                ]
            },
            "q12_help": {
                tag: "💊 救援任務：動機來源拆解",
                text: "知識拆解：分析驅力來源。驅力如果是外加的(分數、金錢)就是外在；如果驅力來自活動本身產生的「好奇心、樂趣、成就感」，也就是源自個人「內部」，稱為什麼動機？",
                options: [
                    { text: "A. 內在動機", next: "q12", isCorrect: true },
                    { text: "B. 外在動機", next: "q12_help", log: "Q12救錯: 題目明確說了『不是為了加分』，所以排除外在因素喔！" }
                ]
            },

            // --- 第 13 關：鷹架教學 ---
            "q13": {
                tag: "第 13 關：建構主義教學",
                text: "教師在指導專題製作時，初期給予詳細的步驟圖與示範；隨著學生逐漸熟練，教師逐步減少提示，最終讓學生完全獨立完成。這種「提供暫時性支援並逐漸撤除」的策略稱為？",
                options: [
                    { text: "A. 鷹架教學 (Scaffolding)", next: "q14", isCorrect: true },
                    { text: "B. 編序教學 (Programmed Instruction)", next: "q13_help", log: "Q13錯: 編序教學是將教材切細，讓學生按固定步驟自學" },
                    { text: "C. 發現學習 (Discovery Learning)", next: "q13_help", log: "Q13錯: 布魯納的發現學習強調讓學生自己找出規則" },
                    { text: "D. 協同教學 (Team Teaching)", next: "q13_help", log: "Q13錯: 這是指兩位以上教師一起上課" }
                ]
            },
            "q13_help": {
                tag: "💊 救援任務：建築工程的比喻",
                text: "知識拆解：此概念借用自建築業。蓋房子的時候需要搭一個架子支撐，等結構穩固了，就會把架子「拆掉(Fading)」。這個策略的名字是？",
                options: [
                    { text: "A. 鷹架教學", next: "q13", isCorrect: true },
                    { text: "B. 編序教學", next: "q13_help", log: "Q13救錯: 編序教學是行為主義的機器式學習，沒有『逐漸撤除支援』的概念！" }
                ]
            },

            // --- 第 14 關：迦納 內省智能 ---
            "q14": {
                tag: "第 14 關：智力理論",
                text: "根據迦納 (H. Gardner) 的多元智能理論，能夠深刻了解「自己」的優缺點、情緒狀態與內在動機，並能據此規劃自我人生的能力，屬於哪一項智能？",
                options: [
                    { text: "A. 內省智能 (Intrapersonal Intelligence)", next: "q15", isCorrect: true },
                    { text: "B. 人際智能 (Interpersonal Intelligence)", next: "q14_help", log: "Q14錯: 人際智能是了解『別人』的能力" },
                    { text: "C. 存在智能 (Existential Intelligence)", next: "q14_help", log: "Q14錯: 這是對生命意義與哲學思考的能力" },
                    { text: "D. 空間智能 (Spatial Intelligence)", next: "q14_help", log: "Q14錯: 這是對視覺與立體結構的掌握能力" }
                ]
            },
            "q14_help": {
                tag: "💊 救援任務：內部與外部的對比",
                text: "知識拆解：人際智能是對外溝通、察言觀色；而這題強調的是「向內」看見真正的自己，進行自我反省與覺察。稱為什麼智能？",
                options: [
                    { text: "A. 內省智能", next: "q14", isCorrect: true },
                    { text: "B. 人際智能", next: "q14_help", log: "Q14救錯: 人際是對外(別人)，內省才是對內(自己)喔！" }
                ]
            },

            // --- 第 15 關：古典制約 刺激類化 ---
            "q15": {
                tag: "第 15 關：古典制約理論",
                text: "學生因為曾被嚴厲的數學老師體罰，現在不只看到數學老師會害怕，連看到「數學課本」或「長得像數學老師的人」都會引發恐懼。這種現象在古典制約中稱為？",
                options: [
                    { text: "A. 刺激類化 (Stimulus Generalization)", next: "end", isCorrect: true },
                    { text: "B. 刺激辨別 (Stimulus Discrimination)", next: "q15_help", log: "Q15錯: 辨別是能分清楚不同的刺激，與此情境相反" },
                    { text: "C. 自發恢復 (Spontaneous Recovery)", next: "q15_help", log: "Q15錯: 這是指消退的反應在休息後突然又出現" },
                    { text: "D. 高階制約 (Higher-order Conditioning)", next: "q15_help", log: "Q15錯: 這是用已經建立的制約刺激去配對新刺激" }
                ]
            },
            "q15_help": {
                tag: "💊 救援任務：一朝被蛇咬，十年怕草繩",
                text: "知識拆解：學生大腦將恐懼反應「擴大解釋」，只要遇到具有「類似特徵」的刺激（數學課本、長得像的人），都會引發相同的反應。這種把刺激歸為同類的現象稱為？",
                options: [
                    { text: "A. 刺激類化", next: "q15", isCorrect: true },
                    { text: "B. 刺激辨別", next: "q15_help", log: "Q15救錯: 如果學生只怕那個老師，不怕其他老師，才叫做刺激辨別！" }
                ]
            }
        };

        // ==========================================
        // 系統變數與遊戲邏輯
        // ==========================================
        let studentName = "";
        let currentStep = "q1"; 
        let hp = 30; 
        let currentStreak = 0; 
        let diagnosticLogs = [];
        let sessionCards = []; 
        let failedQuestions = []; 
        let startTime = 0;           
        let totalTime = 0;           
        let rescueTriggered = 0;     
        let rescueFails = 0;
        let isTransitioning = false; 

        const scriptURL = 'https://script.google.com/macros/s/AKfycbwQnum1bAGvOb-dv5hL08S0pzMB93_gN0ZmoqCQtUjKFYOT-vs8Df0iTT6OMpx_sb6pjg/exec';

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function saveToCollection(cardObj) {
            let storageKey = "gachaCollection_" + studentName;
            let pastCollection = JSON.parse(localStorage.getItem(storageKey)) || [];
            let existingCard = pastCollection.find(c => c.id === cardObj.id);
            if(existingCard) { existingCard.count += 1; } 
            else { pastCollection.push({ ...cardObj, count: 1 }); }
            localStorage.setItem(storageKey, JSON.stringify(pastCollection));
        }

        function openCollection() {
            let inputName = document.getElementById('student-name').value.trim();
            if(!inputName) { alert("請先輸入姓名！"); return; }
            
            let storageKey = "gachaCollection_" + inputName;
            let pastCollection = JSON.parse(localStorage.getItem(storageKey)) || [];
            
            let normalPool = cardPool.filter(c => c.chance > 0);
            let uniqueCount = normalPool.filter(mc => pastCollection.some(pc => pc.id === mc.id)).length;
            let totalCount = normalPool.length;
            document.getElementById('collection-title').innerText = `🏆 ${inputName} 的圖鑑 (${uniqueCount} / ${totalCount})`;
            
            let grid = document.getElementById('collection-grid');
            grid.innerHTML = "";
            
            cardPool.forEach(masterCard => {
                let ownedCard = pastCollection.find(c => c.id === masterCard.id);
                if (masterCard.chance === 0 && !ownedCard) return; 

                if (ownedCard) {
                    let synthHtml = "";
                    // 🚨 雙軌合成判斷邏輯
                    if (masterCard.rarity === "N" && ownedCard.count >= 5) {
                        synthHtml = `<button class="btn-synth" onclick="synthesizeCard('${masterCard.id}', 'c_sp1')">✨ 5合1 裂空座</button>`;
                    } else if (masterCard.rarity === "SR" && ownedCard.count >= 5) {
                        synthHtml = `<button class="btn-synth btn-synth-sr" onclick="synthesizeCard('${masterCard.id}', 'c_sp2')">🔥 5合1 Adebayo</button>`;
                    }

                    grid.innerHTML += `
                        <div class="mini-card">
                            <div class="count">x${ownedCard.count}</div>
                            <img src="${masterCard.image}" alt="${masterCard.name}">
                            <div class="name">${masterCard.name}</div>
                            ${synthHtml}
                        </div>`;
                } else {
                    grid.innerHTML += `
                        <div class="mini-card unowned">
                            <img src="${masterCard.image}" alt="???">
                            <div class="name">【???】未知卡片</div>
                        </div>`;
                }
            });
            document.getElementById('collection-modal').style.display = "flex";
        }

        // 🚨 升級版合成函數 (可指定要合成出哪一張 SP 卡)
        function synthesizeCard(materialId, targetSpId) {
            let inputName = document.getElementById('student-name').value.trim();
            let storageKey = "gachaCollection_" + inputName;
            let pastCollection = JSON.parse(localStorage.getItem(storageKey)) || [];

            let materialIndex = pastCollection.findIndex(c => c.id === materialId);
            if (materialIndex > -1 && pastCollection[materialIndex].count >= 5) {
                // 扣除 5 張素材卡
                pastCollection[materialIndex].count -= 5;
                
                // 取得目標 SP 卡
                let spMaster = cardPool.find(c => c.id === targetSpId);
                let spCardIndex = pastCollection.findIndex(c => c.id === targetSpId);
                
                if (spCardIndex > -1) { pastCollection[spCardIndex].count += 1; } 
                else { pastCollection.push({ ...spMaster, count: 1 }); }
                
                localStorage.setItem(storageKey, JSON.stringify(pastCollection));
                closeCollection();
                showSynthesisAnimation(spMaster);
            }
        }

        function showSynthesisAnimation(spCard) {
            playSound('synth'); 
            const overlay = document.getElementById('gacha-overlay');
            const cardObj = document.getElementById('revealed-card');
            
            document.getElementById('pre-draw-btn').style.display = 'none';
            document.getElementById('gacha-title').innerText = "✨ 碎片融合！傳說覺醒！ ✨";
            
            cardObj.className = "gacha-card card-SP"; 
            document.getElementById('card-image').src = spCard.image; 
            document.getElementById('card-image').style.display = 'block'; 
            document.getElementById('card-name').innerText = spCard.name;
            cardObj.style.display = 'flex';
            
            const postBtn = document.getElementById('post-draw-btn');
            postBtn.innerText = "收下隱藏神卡";
            postBtn.style.display = 'block';
            postBtn.onclick = function() {
                cardObj.style.transform = "scale(0)"; 
                setTimeout(() => {
                    overlay.style.display = "none";
                    postBtn.innerText = "收下神卡並繼續";
                    postBtn.onclick = closeGacha; 
                    openCollection(); 
                }, 300);
            };
            overlay.style.display = "flex";
            setTimeout(() => { cardObj.style.transform = "scale(1)"; }, 100);
        }

        function closeCollection() { document.getElementById('collection-modal').style.display = "none"; }

        function startGame() {
            studentName = document.getElementById('student-name').value.trim();
            if (!studentName) { alert("請先輸入姓名喔！"); return; }
            startTime = Date.now();
            initAudio(); 
            document.getElementById('student-setup').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            updateStatus();
            renderQuestion();
        }

        function renderQuestion() {
            isTransitioning = false; 
            if (currentStep === "end") { finishGame(); return; }
            const q = quizData[currentStep];
            document.getElementById('q-tag').innerText = q.tag;
            document.getElementById('q-text').innerHTML = q.text;

            if (q.tag.includes("救援") || q.tag.includes("提示")) {
                document.getElementById('q-tag').style.background = "#8e44ad"; 
                document.body.classList.add('rescue-mode'); 
            } else {
                document.body.classList.remove('rescue-mode'); 
                if (q.tag.includes("流行") || q.tag.includes("放鬆") || q.tag.includes("時間")) {
                    document.getElementById('q-tag').style.background = "#27ae60"; 
                } else {
                    document.getElementById('q-tag').style.background = "#e74c3c"; 
                }
            }

            const optionsArea = document.getElementById('options-area');
            optionsArea.innerHTML = ""; 

            let shuffledOptions = [...q.options];
            shuffleArray(shuffledOptions);
            const labels = ["A", "B", "C", "D"];

            shuffledOptions.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                let cleanText = opt.text.replace(/^[A-D]\.\s*/, "");
                btn.innerText = `${labels[index]}. ${cleanText}`;
                btn.onclick = () => handleAnswer(opt);
                optionsArea.appendChild(btn);
            });
        }

        function handleAnswer(selectedOption) {
            if (isTransitioning) return; 
            isTransitioning = true; 
            let isRescueQuestion = currentStep.includes("_help"); 

            if (!selectedOption.isCorrect) {
                playSound('wrong'); 
                hp--; if(hp < 0) hp = 0; 
                currentStreak = 0; 
                updateStatus();
                if (selectedOption.log) diagnosticLogs.push(selectedOption.log);
                
                if (!failedQuestions.includes(currentStep)) {
                    failedQuestions.push(currentStep);
                }

                if (!isRescueQuestion) { rescueTriggered++; } 
                else { rescueFails++; }

                currentStep = selectedOption.next;
                renderQuestion();
            } 
            else {
                playSound('correct'); 
                showCorrectSplash();  
                
                if (!isRescueQuestion && !failedQuestions.includes(currentStep)) {
                    currentStreak++;
                }

                setTimeout(() => {
                    let nextStep = selectedOption.next;
                    
                    if (currentStreak >= 2) {
                        currentStreak = 0; 
                        currentStep = nextStep;
                        document.getElementById('gacha-title').innerText = "🔥 二連擊達成！獲得抽卡機會！ ✨";
                        prepareGacha(); 
                    } else {
                        currentStep = nextStep;
                        renderQuestion();
                    }
                    updateStatus();
                }, 800);
            }
        }

        function showCorrectSplash() {
            const splash = document.getElementById('correct-splash');
            splash.classList.add('show');
            setTimeout(() => { splash.classList.remove('show'); }, 600);
        }

        function updateStatus() {
            let hpText = hp > 10 ? `❤️❤️ x ${hp}` : "❤️".repeat(hp);
            document.getElementById('hearts').innerText = hpText;
            document.getElementById('streak-display').innerText = `🔥 連擊: ${currentStreak} / 2`;
        }

        function prepareGacha() {
            const overlay = document.getElementById('gacha-overlay');
            document.getElementById('pre-draw-btn').style.display = 'block';
            document.getElementById('revealed-card').style.display = 'none';
            document.getElementById('post-draw-btn').style.display = 'none';
            overlay.style.display = "flex";
        }

        function executeDraw() {
            playSound('draw'); 
            document.getElementById('pre-draw-btn').style.display = 'none';
            document.getElementById('gacha-title').innerText = "🎉 戰利品揭曉 🎉";
            drawCard(); 
        }

        function drawCard() {
            const cardObj = document.getElementById('revealed-card');
            let drawablePool = cardPool.filter(c => c.chance > 0);
            let randomNum = Math.random() * 100;
            let currentLimit = 0;
            let resultCard = drawablePool[drawablePool.length - 1]; 
            for (let i = 0; i < drawablePool.length; i++) {
                currentLimit += drawablePool[i].chance;
                if (randomNum <= currentLimit) { resultCard = drawablePool[i]; break; }
            }

            cardObj.className = "gacha-card"; 
            cardObj.classList.add(`card-${resultCard.rarity}`);
            document.getElementById('card-image').src = resultCard.image; 
            document.getElementById('card-image').style.display = 'block'; 
            document.getElementById('card-name').innerText = resultCard.name;
            
            cardObj.style.display = 'flex';
            document.getElementById('post-draw-btn').style.display = 'block';
            setTimeout(() => { cardObj.style.transform = "scale(1)"; }, 100);

            sessionCards.push(resultCard.name);
            saveToCollection(resultCard); 
            document.getElementById('inventory-display').innerText = `🎒 本局已抽: ${sessionCards.length} 張`;
        }

        function closeGacha() {
            const overlay = document.getElementById('gacha-overlay');
            const cardObj = document.getElementById('revealed-card');
            cardObj.style.transform = "scale(0)"; 
            setTimeout(() => {
                overlay.style.display = "none";
                renderQuestion(); 
            }, 300);
        }

        function finishGame() {
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';

            totalTime = Math.round((Date.now() - startTime) / 1000);

            let reportArea = document.getElementById('log-report');
            let finalScoreText = `血量剩餘：${hp}\n🕒 耗時：${totalTime} 秒\n🏀 本局共獲得 ${sessionCards.length} 張卡片\n\n`;
            let logText = diagnosticLogs.length === 0 ? "🌟 完美通關，基礎極度扎實！" : "⚠️ 盲點診斷 (請老師留意)：\n" + diagnosticLogs.join("\n");
            
            reportArea.innerText = finalScoreText + logText;

            let itemsText = sessionCards.length > 0 ? sessionCards.join(",") : "無";
            sendDataToSheet(
                studentName, hp, totalTime, rescueTriggered, rescueFails, 
                diagnosticLogs.length, diagnosticLogs.join(" | "), itemsText
            );
        }

        function sendDataToSheet(name, hp, time, rescueT, rescueF, errorCount, errorDetails, cards) {
            let formData = new URLSearchParams();
            formData.append('name', name);
            formData.append('hp', hp);
            formData.append('time', time);
            formData.append('rescueTriggered', rescueT);
            formData.append('rescueFails', rescueF); 
            formData.append('errorCount', errorCount);
            formData.append('errorDetails', errorDetails);
            formData.append('cards', cards);
            
            let storageKey = "gachaCollection_" + name;
            let fullCollection = localStorage.getItem(storageKey) || "[]";
            formData.append('fullCollection', fullCollection);
            fetch(scriptURL, { method: 'POST', body: formData });
        }

        async function syncCloudData() {
            let inputName = document.getElementById('student-name').value.trim();
            if(!inputName) { alert("⚠️ 請先輸入您的姓名，才能尋找雲端存檔喔！"); return; }

            let syncBtn = document.getElementById('btn-sync');
            let originalText = syncBtn.innerText;
            syncBtn.innerText = "⏳ 雲端同步中，請稍候...";
            syncBtn.disabled = true;

            try {
                let response = await fetch(scriptURL + "?name=" + encodeURIComponent(inputName), { method: "GET" });
                let result = await response.json();

                if(result.status === "success") {
                    localStorage.setItem("gachaCollection_" + inputName, result.data);
                    alert("✅ 雲端同步成功！已為您載入最新的圖鑑進度！\n您可以點擊「查看我的圖鑑」確認。");
                } else {
                    alert("🆕 找不到您的雲端存檔。\n如果您是第一次玩，這是正常的，系統將為您建立全新圖鑑！");
                }
            } catch(e) {
                alert("❌ 同步失敗，請檢查網路連線或稍後再試。");
                console.error(e);
            } finally {
                syncBtn.innerText = originalText;
                syncBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
